<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · UniHub</title>
    <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
    <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/vendor/tabler/js/tabler.min.js"></script>
    <script defer src="/js/common.js"></script>
    <script defer src="/js/auth.js"></script>
</head>
<body class="d-flex flex-column">
    <a class="visually-hidden-focusable btn btn-primary position-absolute m-2" href="#content">Skip to main content</a>
    <div class="page page-center">
        <main class="container container-tight py-4" id="content">
            <div class="text-center mb-4">
                <a class="navbar-brand pe-0 pe-md-3" href="/" aria-label="UniHub home">
                    <span class="brand-mark" aria-hidden="true">U</span>UniHub
                </a>
            </div>
            <div id="notice" class="alert" role="status" aria-live="polite" hidden></div>
            <div class="card card-md">
                <div class="card-body">
                    <h1 class="h2 text-center mb-4">Log in to your account</h1>
                    <form id="login-form" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="identifier">Username or email</label>
                            <input id="identifier" class="form-control" name="identifier" type="text" autocomplete="username" required maxlength="150">
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="password">Password</label>
                            <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" required maxlength="256">
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary w-100">Log in</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center text-secondary mt-3">New to UniHub? <a href="/register.html">Create an account</a></div>
        </main>
    </div>
</body>
</html>
