<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lost & Found · UniHub</title>
    <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
    <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/vendor/tabler/js/tabler.min.js"></script>
    <script defer src="/js/common.js"></script>
    <script defer src="/js/lost-found.js"></script>
</head>
<body>
    <a class="visually-hidden-focusable btn btn-primary position-absolute m-2" href="#content">Skip to main content</a>
    <div class="page">
        <header class="navbar navbar-expand-md d-print-none">
            <div class="container-xl">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <a class="navbar-brand pe-0 pe-md-3" href="/dashboard.html" aria-label="UniHub home">
                    <span class="brand-mark" aria-hidden="true">U</span>UniHub
                </a>
                <div class="navbar-nav flex-row order-md-last">
                    <div class="nav-item dropdown" id="user-menu" hidden>
                        <a href="#" class="nav-link d-flex lh-1 p-0 px-2" data-bs-toggle="dropdown" aria-label="Open account menu">
                            <span class="avatar avatar-sm" id="user-initials"></span>
                            <span class="d-none d-xl-block ps-2">
                                <span class="d-block" id="user-name"></span>
                                <span class="d-block mt-1 small text-secondary" id="user-role"></span>
                            </span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                            <a href="/profile" class="dropdown-item"><i class="ti ti-user dropdown-item-icon" aria-hidden="true"></i>Profile</a>
                            <div class="dropdown-divider"></div>
                            <button type="button" id="logout" class="dropdown-item"><i class="ti ti-logout dropdown-item-icon" aria-hidden="true"></i>Log out</button>
                        </div>
                    </div>
                </div>
                <div class="collapse navbar-collapse" id="navbar-menu">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/dashboard.html">
                                <span class="nav-link-icon"><i class="ti ti-layout-dashboard" aria-hidden="true"></i></span>
                                <span class="nav-link-title">Dashboard</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/equipment.html">
                                <span class="nav-link-icon"><i class="ti ti-device-laptop" aria-hidden="true"></i></span>
                                <span class="nav-link-title">Equipment</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/lost-found.html">
                                <span class="nav-link-icon"><i class="ti ti-search" aria-hidden="true"></i></span>
                                <span class="nav-link-title">Lost &amp; Found</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/volunteering.html">
                                <span class="nav-link-icon"><i class="ti ti-heart-handshake" aria-hidden="true"></i></span>
                                <span class="nav-link-title">Volunteering</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/profile">
                                <span class="nav-link-icon"><i class="ti ti-user" aria-hidden="true"></i></span>
                                <span class="nav-link-title">Profile</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>
        <main class="page-wrapper" id="content">
            <div class="page-header d-print-none">
                <div class="container-xl">
                    <div class="row g-2 align-items-center">
                        <div class="col">
                            <div class="page-pretitle">Reconnect</div>
                            <h1 class="page-title">Lost &amp; Found</h1>
                        </div>
                        <div class="col-auto ms-auto d-print-none">
                            <div class="btn-list">
                                <button type="button" id="new-report" class="btn btn-primary"><i class="ti ti-plus icon" aria-hidden="true"></i>Report an item</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="page-body">
                <div class="container-xl">
                    <div id="notice" class="alert" role="status" aria-live="polite" hidden></div>
                    <form id="report-filters" class="card mb-3" role="search">
                        <div class="card-body">
                            <div class="row g-2 align-items-end">
                                <div class="col-md">
                                    <label class="form-label" for="report-search">Search</label>
                                    <div class="input-icon">
                                        <span class="input-icon-addon"><i class="ti ti-search" aria-hidden="true"></i></span>
                                        <input id="report-search" class="form-control" name="search" type="search" placeholder="Item, category, or location">
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <label class="form-label" for="report-type-filter">Type</label>
                                    <select id="report-type-filter" class="form-select" name="report_type"><option value="">All</option><option value="Lost">Lost</option><option value="Found">Found</option></select>
                                </div>
                                <div class="col-6 col-md-2">
                                    <label class="form-label" for="report-status-filter">Status</label>
                                    <select id="report-status-filter" class="form-select" name="status"><option value="">All</option><option value="Open" selected>Open</option><option value="Resolved">Resolved</option></select>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label" for="report-mine-filter">Show</label>
                                    <select id="report-mine-filter" class="form-select" name="mine"><option value="">Everyone</option><option value="1">Only mine</option></select>
                                </div>
                                <div class="col-md-auto">
                                    <button type="submit" class="btn btn-primary w-100"><i class="ti ti-filter icon" aria-hidden="true"></i>Apply</button>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div id="report-list" class="row row-cards">
                        <div class="col-12 text-secondary py-3">Loading reports…</div>
                    </div>
                </div>
            </div>
            <footer class="footer footer-transparent d-print-none">
                <div class="container-xl text-secondary">UniHub · Equipment, lost &amp; found, and volunteering in one place.</div>
            </footer>
        </main>
    </div>
    <div class="modal modal-blur fade" id="report-editor" tabindex="-1" aria-labelledby="editor-title" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <form class="modal-content" id="report-form">
                <div class="modal-header">
                    <h2 class="modal-title" id="editor-title">New report</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="modal-notice alert" role="alert" hidden></div>
                    <input type="hidden" name="id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="report-type">Report type</label>
                            <select id="report-type" class="form-select" name="report_type"><option>Lost</option><option>Found</option></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="report-item">Item name</label>
                            <input id="report-item" class="form-control" name="item_name" type="text" required maxlength="150">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="report-category">Category</label>
                            <input id="report-category" class="form-control" name="category" type="text" required maxlength="80" placeholder="e.g. Keys, Electronics">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="report-location">Location</label>
                            <input id="report-location" class="form-control" name="location" type="text" required maxlength="255">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="report-date">Date lost or found</label>
                            <input id="report-date" class="form-control" name="item_date" type="date" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="report-email">Contact email</label>
                            <input id="report-email" class="form-control" name="contact_email" type="email" required maxlength="150">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="report-status">Status</label>
                            <select id="report-status" class="form-select" name="status"><option>Open</option><option>Resolved</option></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="report-description">Description</label>
                            <textarea id="report-description" class="form-control" name="description" rows="4" required maxlength="5000"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save report</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
