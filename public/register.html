<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account · UniHub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/js/common.js"></script>
    <script defer src="/js/auth.js"></script>
</head>
<body>
    <a class="skip-link" href="#content">Skip to main content</a>
    <header class="site-header">
        <a class="logo" href="/" aria-label="UniHub home">
            <span class="logo-mark" aria-hidden="true">U</span>
            <span class="logo-text">Uni<strong>Hub</strong></span>
        </a>
        <nav aria-label="Main">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/equipment.html">Equipment</a>
            <a href="/lost-found.html">Lost &amp; Found</a>
            <a href="/volunteering.html">Volunteering</a>
            <a href="/profile">Profile</a>
        </nav>
        <button id="logout" class="secondary" type="button" hidden>Log out</button>
    </header>

    <main id="content">
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
        <section class="auth panel">
            <p class="eyebrow">Join your campus</p>
            <h1>Create your account</h1>
            <form id="register-form" novalidate>
                <label for="username">Username <span class="hint">(3–50 letters, numbers, . _ -)</span></label>
                <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.\-]{3,50}">

                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required maxlength="150">

                <label for="password">Password <span class="hint">(at least 8 characters)</span></label>
                <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="256">

                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="256">

                <button type="submit">Create account</button>
            </form>
            <p>Already registered? <a href="/login.html">Log in</a></p>
        </section>
    </main>

    <footer>UniHub · Equipment, lost &amp; found, and volunteering in one place.</footer>
</body>
</html>
