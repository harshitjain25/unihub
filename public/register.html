<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account · UniHub</title>
    <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
    <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/vendor/tabler/js/tabler.min.js"></script>
    <script defer src="/js/common.js"></script>
    <script defer src="/js/auth.js"></script>
</head>
<body class="d-flex flex-column">
    <a class="visually-hidden-focusable btn btn-primary position-absolute m-2" href="#content">Skip to main content</a>
    <div class="page page-center">
        <main class="container container-tight py-4" id="content">
            <div class="text-center mb-4">
                <a class="navbar-brand pe-0 pe-md-3" href="/" aria-label="UniHub home">
                    <span class="brand-mark" aria-hidden="true">U</span>UniHub
                </a>
            </div>
            <div id="notice" class="alert" role="status" aria-live="polite" hidden></div>
            <div class="card card-md">
                <div class="card-body">
                    <h1 class="h2 text-center mb-4">Create your account</h1>
                    <form id="register-form" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input id="username" class="form-control" name="username" type="text" autocomplete="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.\-]{3,50}" aria-describedby="username-hint">
                            <small class="form-hint" id="username-hint">3–50 letters, numbers, dots, dashes, or underscores.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input id="email" class="form-control" name="email" type="email" autocomplete="email" required maxlength="150">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input id="password" class="form-control" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="256" aria-describedby="password-hint">
                            <small class="form-hint" id="password-hint">At least 8 characters.</small>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="confirmPassword">Confirm password</label>
                            <input id="confirmPassword" class="form-control" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="256">
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary w-100">Create account</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center text-secondary mt-3">Already registered? <a href="/login.html">Log in</a></div>
        </main>
    </div>
</body>
</html>
